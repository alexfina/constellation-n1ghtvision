<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>N1ghtvision</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">N1GHTVISION V1.0</p>
        <h1>Find something worth watching</h1>
      </section>

      <section class="panel" aria-label="Recommendation filters">
        <div class="filters">
          <label class="field">
            <span>Region</span>
            <select id="region-select" name="region">
              <option value="">Loading regions...</option>
            </select>
          </label>

          <label class="field">
            <span>Platform</span>
            <select id="platform-select" name="platform">
              <option value="">Loading platforms...</option>
            </select>
          </label>

          <label class="field">
            <span>Type</span>
            <select id="type-select" name="type">
              <option value="">All Types</option>
              <option value="movie">Movies</option>
              <option value="series">Series</option>
            </select>
          </label>

          <label class="field">
            <span>Format / Style</span>
            <select id="format-select" name="formatStyle">
              <option value="">All Formats</option>
              <option value="Live Action">Live Action</option>
              <option value="Anime">Anime</option>
              <option value="Documentary">Documentary</option>
            </select>
          </label>

          <label class="field">
            <span>Genre</span>
            <select id="genre-select" name="genre">
              <option value="">Loading genres...</option>
            </select>
          </label>

          <label class="field">
            <span>Rating</span>
            <select id="rating-select" name="rating">
              <option value="">All Ratings</option>
              <option value="7">7.0+</option>
              <option value="8">8.0+</option>
              <option value="9">9.0+</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <div class="actions-left">
            <button id="reveal-button" type="button">Show results</button>
            <button id="shuffle-button" type="button" hidden>Shuffle results</button>
          </div>
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <div class="actions-right">
            <button id="saved-only-button" type="button" aria-pressed="false" aria-label="Show watchlist" title="Show watchlist"></button>
          </div>
        </div>
      </section>

      <section class="results" aria-label="Recommendation results">
        <div class="results-header">
          <p id="result-context" class="result-context" aria-live="polite"></p>
        </div>
        <div id="results-grid" class="results-grid"></div>
        <div class="results-actions">
          <button id="show-more-button" type="button" hidden>Show more</button>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <p>N1GHTVISION is not affiliated with or endorsed by IMDb, TMDB, or any streaming provider.</p>
    </footer>
  </body>
</html>
