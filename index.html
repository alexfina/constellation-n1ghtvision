<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>N1GHTVISION</title>
    <link rel="icon" type="image/svg+xml" href="assets/icons/clapperboard.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">N1GHTVISION V1.0</p>
        <h1>Find something worth watching</h1>
      </section>

      <section class="panel" aria-label="Recommendation filters">
        <div class="filters">
          <div class="field custom-dropdown-field">
            <span>Region</span>
            <div id="region-select" class="custom-dropdown" data-dropdown-name="region">
              <button id="region-toggle" class="genre-toggle custom-dropdown-toggle" type="button" aria-expanded="false" aria-controls="region-panel">
                <span id="region-summary">Loading regions...</span>
              </button>
              <div id="region-panel" class="genre-panel custom-dropdown-panel" hidden></div>
            </div>
          </div>

          <div class="field custom-dropdown-field">
            <span>Platform</span>
            <div id="platform-select" class="custom-dropdown" data-dropdown-name="platform">
              <button id="platform-toggle" class="genre-toggle custom-dropdown-toggle" type="button" aria-expanded="false" aria-controls="platform-panel">
                <span id="platform-summary">Loading platforms...</span>
              </button>
              <div id="platform-panel" class="genre-panel custom-dropdown-panel" hidden></div>
            </div>
          </div>

          <div class="field custom-dropdown-field">
            <span>Type</span>
            <div id="type-select" class="custom-dropdown" data-dropdown-name="type">
              <button id="type-toggle" class="genre-toggle custom-dropdown-toggle" type="button" aria-expanded="false" aria-controls="type-panel">
                <span id="type-summary">All Types</span>
              </button>
              <div id="type-panel" class="genre-panel custom-dropdown-panel" hidden></div>
            </div>
          </div>

          <div class="field custom-dropdown-field">
            <span>Format / Style</span>
            <div id="format-select" class="custom-dropdown" data-dropdown-name="formatStyle">
              <button id="format-toggle" class="genre-toggle custom-dropdown-toggle" type="button" aria-expanded="false" aria-controls="format-panel">
                <span id="format-summary">All Formats</span>
              </button>
              <div id="format-panel" class="genre-panel custom-dropdown-panel" hidden></div>
            </div>
          </div>

          <div class="field genre-field">
            <span>Genre</span>
            <div id="genre-select" class="genre-control">
              <button id="genre-toggle" class="genre-toggle" type="button" aria-expanded="false" aria-controls="genre-panel">
                <span id="genre-summary">Loading genres...</span>
              </button>
              <div id="genre-panel" class="genre-panel" hidden></div>
            </div>
          </div>

          <div class="field custom-dropdown-field">
            <span>Rating</span>
            <div id="rating-select" class="custom-dropdown" data-dropdown-name="rating">
              <button id="rating-toggle" class="genre-toggle custom-dropdown-toggle" type="button" aria-expanded="false" aria-controls="rating-panel">
                <span id="rating-summary">All Ratings</span>
              </button>
              <div id="rating-panel" class="genre-panel custom-dropdown-panel" hidden></div>
            </div>
          </div>
        </div>

        <div class="actions">
          <div class="actions-left">
            <button id="reveal-button" type="button">Show results</button>
            <button id="shuffle-button" type="button" hidden>Shuffle results</button>
          </div>
          <p id="status" class="status" role="status" aria-live="polite"></p>
          <div class="actions-right">
            <button id="saved-only-button" type="button" aria-pressed="false" aria-label="Show watchlist" title="Show watchlist"></button>
          </div>
        </div>
      </section>

      <section class="results" aria-label="Recommendation results">
        <div class="results-header">
          <p id="result-context" class="result-context" aria-live="polite"></p>
        </div>
        <div id="results-grid" class="results-grid"></div>
        <div class="results-actions">
          <button id="show-more-button" type="button" hidden>Show more</button>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <p>N1GHTVISION is not affiliated with or endorsed by IMDb, TMDB, or any streaming provider.</p>
    </footer>
  </body>
</html>
